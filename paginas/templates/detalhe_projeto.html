{% extends "base.html" %}
{% block conteudo %}
<h1>{{ projeto.nome }}</h2>
<p>{{ projeto.descricao }}</p>
<p>Ano: {{ projeto.ano }}</p>
<p>Categoria: 
    {{ projeto.categoria.nome }}
</p>

<a href="/projetos/{{ projeto.id }}/editar/" class="botao botao-azul" >Editar</a>
<a href="/projetos/{{ projeto.id }}/excluir/" class="botao botao-vermelho">Excluir</a>
<a href="/projetos/" class="botao botao-laranja">Voltar</a>
{% endblock %}
